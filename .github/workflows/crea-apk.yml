name: Crea APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compila l'app
        run: gradle --no-daemon assembleDebug

      - name: Rinomina l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk webcam-gallipoli.apk

      - name: Pubblica l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Webcam Gallipoli
          body: "APK per Fire TV. Ultima versione creata automaticamente."
          files: webcam-gallipoli.apk
          make_latest: true

      - name: Allega l'APK anche ai risultati della compilazione
        uses: actions/upload-artifact@v4
        with:
          name: webcam-gallipoli-apk
          path: webcam-gallipoli.apk
